name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version_gate:
    runs-on: ubuntu-24.04
    outputs:
      run_ci: ${{ steps.decision.outputs.run_ci }}
      release: ${{ steps.decision.outputs.release }}
      version: ${{ steps.decision.outputs.version }}
      reason: ${{ steps.decision.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Decide whether full CI is needed
        id: decision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "reason=manual run" >> "$GITHUB_OUTPUT"
          else
            python scripts/ci_version_gate.py \
              --before "$BEFORE_SHA" \
              --after "$AFTER_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Report decision
        env:
          RUN_CI: ${{ steps.decision.outputs.run_ci }}
          RELEASE: ${{ steps.decision.outputs.release }}
          VERSION: ${{ steps.decision.outputs.version }}
          REASON: ${{ steps.decision.outputs.reason }}
        run: echo "Run full CI=$RUN_CI; release=$RELEASE; version=$VERSION ($REASON)"

  build-and-test:
    needs: version_gate
    if: needs.version_gate.outputs.run_ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cpack-generator: 'DEB;RPM'
            artifact-name: notepeek-linux-x86_64
            package-suffix: Linux-x86_64
          - os: ubuntu-24.04-arm
            cpack-generator: 'DEB;RPM'
            artifact-name: notepeek-linux-arm64
            package-suffix: Linux-arm64
            qt-arch: linux_gcc_arm64
          - os: windows-2022
            cpack-generator: NSIS
            artifact-name: notepeek-windows
            package-suffix: win64
            qt-arch: win64_mingw
            qt-tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          - os: macos-15
            cpack-generator: DragNDrop
            artifact-name: notepeek-macos-arm64
            package-suffix: Darwin-arm64
            performance-open-budget-ms: 24000
          - os: macos-15-intel
            cpack-generator: DragNDrop
            artifact-name: notepeek-macos-x86_64
            package-suffix: Darwin-x86_64
            performance-open-budget-ms: 24000
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt-arch }}
          tools: ${{ matrix.qt-tools }}
          # Core5Compat provides QTextCodec, which backs the legacy
          # (GB18030, Big5, Shift-JIS, EUC-KR) document encodings.
          modules: 'qt5compat'
          cache: true
          cache-key-prefix: notepeek-qt-${{ matrix.artifact-name }}
      - name: Install Linux packaging tools
        if: runner.os == 'Linux' && needs.version_gate.outputs.release == 'true'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNOTEPEEK_PACKAGE_SUFFIX=${{ matrix.package-suffix }}
      - name: Build
        run: >-
          python scripts/ci_command.py
          --title "Qt 6 build failed on ${{ runner.os }}"
          -- cmake --build build-ci --parallel 2
      - name: Test
        env:
          NOTEPEEK_OPEN_SMOKE_BUDGET_MS: ${{ matrix.performance-open-budget-ms }}
        run: >-
          python scripts/ci_command.py
          --title "Qt 6 tests failed on ${{ runner.os }}"
          -- ctest --test-dir build-ci --output-on-failure
      - name: Install smoke test
        run: cmake --install build-ci --prefix "${{ runner.temp }}/notepeek-install"
      - name: Verify installed artifacts
        run: >-
          python scripts/ci_command.py
          --title "Installed app verification failed on ${{ runner.os }}"
          -- python scripts/verify_install.py
          "${{ runner.temp }}/notepeek-install" --run
      - name: Package release installers
        if: needs.version_gate.outputs.release == 'true'
        run: >-
          python scripts/ci_command.py
          --title "Packaging failed on ${{ runner.os }}"
          -- cpack --config build-ci/CPackConfig.cmake
          -G "${{ matrix.cpack-generator }}"
          -B "${{ github.workspace }}/packages"
      - name: Upload release installers
        if: needs.version_gate.outputs.release == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            packages/NotePeek-*.dmg
            packages/NotePeek-*.exe
            packages/NotePeek-*.deb
            packages/NotePeek-*.rpm
          if-no-files-found: error
          retention-days: 7

  qt5-compatibility:
    needs: version_gate
    if: needs.version_gate.outputs.run_ci == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          cache: true
      - name: Configure Qt 5.15
        run: >-
          cmake -S . -B build-compat -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNOTEPEEK_FORCE_QT_MAJOR=5
      - name: Build
        run: >-
          python scripts/ci_command.py
          --title "Qt 5.15 build failed"
          -- cmake --build build-compat --parallel 2
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python scripts/ci_command.py
          --title "Qt 5.15 tests failed"
          -- ctest --test-dir build-compat --output-on-failure

  publish-release:
    needs: [version_gate, build-and-test, qt5-compatibility]
    if: needs.version_gate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release installers
        uses: actions/download-artifact@v8
        with:
          pattern: notepeek-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version_gate.outputs.version }}
          name: NotePeek ${{ needs.version_gate.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
