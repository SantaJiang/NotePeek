name: Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            cpack-generator: DragNDrop
            artifact-name: notepeek-macos
          - os: windows-2022
            cpack-generator: NSIS
            artifact-name: notepeek-windows
          - os: ubuntu-22.04
            cpack-generator: 'DEB;RPM'
            artifact-name: notepeek-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Configure
        run: >-
          cmake -S . -B build-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-release --parallel 2
      - name: Test
        run: ctest --test-dir build-release --output-on-failure
      - name: Package
        shell: bash
        run: cpack --config build-release/CPackConfig.cmake -G "${{ matrix.cpack-generator }}" -B "${{ github.workspace }}/packages"
      - name: Upload release installers
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            packages/NotePeek-*.dmg
            packages/NotePeek-*.exe
            packages/NotePeek-*.deb
            packages/NotePeek-*.rpm
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - name: Download release installers
        uses: actions/download-artifact@v8
        with:
          pattern: notepeek-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
