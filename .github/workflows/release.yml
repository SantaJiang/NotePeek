name: Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            cpack-generator: DragNDrop
            artifact-name: notepeek-macos-arm64
            package-suffix: Darwin-arm64
            performance-open-budget-ms: 24000
            macos-min-version: '13.0'
          - os: windows-2022
            cpack-generator: NSIS
            artifact-name: notepeek-windows
            package-suffix: win64
            qt-arch: win64_mingw
            qt-tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          - os: ubuntu-22.04
            cpack-generator: 'DEB;RPM'
            artifact-name: notepeek-linux-x86_64
            package-suffix: Linux-x86_64
            glibc-min-version: '2.35'
          - os: ubuntu-24.04-arm
            cpack-generator: 'DEB;RPM'
            artifact-name: notepeek-linux-arm64
            package-suffix: Linux-arm64
            qt-arch: linux_gcc_arm64
            glibc-min-version: '2.39'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt-arch }}
          tools: ${{ matrix.qt-tools }}
          cache: true
          cache-key-prefix: notepeek-qt-${{ matrix.artifact-name }}
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Configure
        run: >-
          cmake -S . -B build-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNOTEPEEK_PACKAGE_SUFFIX=${{ matrix.package-suffix }}
          -DNOTEPEEK_LINUX_GLIBC_MIN_VERSION=${{ matrix.glibc-min-version }}
      - name: Build
        run: cmake --build build-release --parallel 2
      - name: Test
        env:
          NOTEPEEK_OPEN_SMOKE_BUDGET_MS: ${{ matrix.performance-open-budget-ms }}
        run: >-
          python scripts/ci_command.py
          --title "Release tests failed on ${{ runner.os }}"
          -- ctest --test-dir build-release --output-on-failure
      - name: Install compatibility fixture
        if: runner.os != 'Windows'
        run: cmake --install build-release --prefix "${{ runner.temp }}/notepeek-compat"
      - name: Verify macOS deployment target
        if: runner.os == 'macOS'
        run: >-
          python3 scripts/verify_binary_compat.py
          "${{ runner.temp }}/notepeek-compat"
          --macos "${{ matrix.macos-min-version }}"
      - name: Verify Linux glibc contract
        if: runner.os == 'Linux'
        run: >-
          python3 scripts/verify_binary_compat.py
          "${{ runner.temp }}/notepeek-compat"
          --glibc "${{ matrix.glibc-min-version }}"
      - name: Package
        run: >-
          python scripts/ci_command.py
          --title "Release packaging failed on ${{ runner.os }}"
          -- cpack --config build-release/CPackConfig.cmake
          -G "${{ matrix.cpack-generator }}"
          -B "${{ github.workspace }}/packages"
      - name: Upload release installers
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            packages/NotePeek-*.dmg
            packages/NotePeek-*.exe
            packages/NotePeek-*.deb
            packages/NotePeek-*.rpm
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - name: Download release installers
        uses: actions/download-artifact@v8
        with:
          pattern: notepeek-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## macOS 安装提示

            当前 macOS 安装包未使用 Apple Developer ID 签名和公证。从本页面下载后，macOS 可能提示应用“已损坏”或无法验证开发者。

            请先将 `NotePeek.app` 拖入“应用程序”文件夹，然后在“终端”中运行：

            ```bash
            xattr -dr com.apple.quarantine /Applications/NotePeek.app
            ```

            完成后即可正常打开。请只对从本项目官方 GitHub Release 页面下载的安装包执行此命令。
          fail_on_unmatched_files: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
