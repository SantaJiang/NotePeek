name: Scheduled quality audit

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-and-static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
          cache-key-prefix: notepeek-quality-qt
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Configure strict static-analysis build
        run: >-
          cmake -S . -B build-quality -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DNOTEPEEK_WARNINGS_AS_ERRORS=ON
          -DNOTEPEEK_ENABLE_CLANG_TIDY=ON
      - name: Build and analyze NotePeek targets
        run: cmake --build build-quality --parallel 2
      - name: Run tests
        run: ctest --test-dir build-quality --output-on-failure -LE performance

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
          cache-key-prefix: notepeek-quality-qt
      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build-sanitizers -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DNOTEPEEK_WARNINGS_AS_ERRORS=ON
          -DNOTEPEEK_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-sanitizers --parallel 2
      - name: Run tests under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitizers --output-on-failure -LE performance

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
          cache-key-prefix: notepeek-quality-qt
      - name: Install coverage tools
        run: sudo apt-get update && sudo apt-get install -y gcovr
      - name: Configure coverage build
        run: >-
          cmake -S . -B build-coverage -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DNOTEPEEK_ENABLE_COVERAGE=ON
      - name: Build and test
        run: cmake --build build-coverage --parallel 2 && ctest --test-dir build-coverage --output-on-failure -LE performance
      - name: Generate coverage reports
        run: >-
          gcovr --root . build-coverage
          --filter 'src/MainPage'
          --exclude 'src/MainPage/.*/ui_.*'
          --xml coverage.xml
          --html-details coverage.html
          --print-summary
      - uses: actions/upload-artifact@v6
        with:
          name: notepeek-coverage
          path: |
            coverage.xml
            coverage.html
            coverage.*.html
          retention-days: 14
